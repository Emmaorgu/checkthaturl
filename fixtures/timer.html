<!doctype html><meta charset="utf-8">
<title>Timer Fixture</title>
<p id="label">Offer ends in <span id="t">00:20</span></p>
<script>
let s=20; const el=document.getElementById('t');
setInterval(()=>{ if(s>0){ s--; const mm=String(Math.floor(s/60)).padStart(2,'0');
const ss=String(s%60).padStart(2,'0'); el.textContent=`${mm}:${ss}`;} },1000);
</script>
