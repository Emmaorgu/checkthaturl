services:
  - type: web
    name: checkthaturl
    env: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    autoDeploy: true

    # Use either Dockerfile HEALTHCHECK or this HTTP path (both are fine)
    healthCheckPath: /health

    envVars:
      # --- existing flags you already had ---
      - key: CTU_SELF_HOSTED
        value: "0"
      - key: CTU_BEHAVIOR
        value: "1"
      - key: CTU_PLAYWRIGHT
        value: "0"
      - key: CTU_PLAYWRIGHT_HEADLESS
        value: "1"
      - key: CTU_VISUAL
        value: "0"
      - key: CTU_FEEDBACK
        value: "1"
      - key: CTU_FEEDBACK_SALT
        sync: false

      # --- new flags used by app/app.py hardening you deployed ---
      # (Keep 'off' for first deploy if you want zero risk; then flip to 'auto')
      - key: CTU_BEHAVIOR_MODE
        value: "auto"
      - key: CTU_BEHAVIOR_TIMEOUT_SEC
        value: "8"
      - key: CTU_SOFT_WHITELIST_SELF
        value: "1"

      # Render passes PORT to the container; Dockerfile uses it
      - key: PORT
        value: "10000"

    disks:
      - name: ctu-data
        # Keep your existing mountPath so nothing else changes
        mountPath: /opt/render/project/src/data
        sizeGB: 1
