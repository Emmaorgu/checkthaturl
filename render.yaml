services:
  - type: web
    name: checkthaturl
    env: python
    plan: free
    region: oregon
    buildCommand: |
      # Show runtime being used (must be Python 3.10.14)
      python -V
      pip --version

      # Normalize requirements.txt to UTF-8 on the build machine (idempotent)
      python - <<'PY'
import pathlib
p=pathlib.Path("requirements.txt")
b=p.read_bytes()
for enc in ("utf-8","utf-8-sig","utf-16","utf-16-le","utf-16-be"):
    try:
        t=b.decode(enc)
        p.write_text(t, encoding="utf-8")
        break
    except Exception:
        pass
PY

      # Install deps
      pip install --no-cache-dir -r requirements.txt

    startCommand: gunicorn app.app:app -w 2 -k gthread -b 0.0.0.0:$PORT --timeout 180
    envVars:
      - key: CTU_SELF_HOSTED
        value: "0"
      - key: CTU_BEHAVIOR
        value: "1"
      - key: CTU_PLAYWRIGHT
        value: "0"
      - key: CTU_PLAYWRIGHT_HEADLESS
        value: "1"
      - key: CTU_VISUAL
        value: "0"
      - key: CTU_FEEDBACK
        value: "1"
      - key: CTU_FEEDBACK_SALT
        sync: false
