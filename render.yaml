services:
  - type: web
    name: checkthaturl
    env: docker
    plan: starter
    autoDeploy: true
    healthCheckPath: /healthz

    envVars:
      # timing & mode
      - key: TZ
        value: Africa/Lagos
      - key: SCAN_MODE
        value: playwright
      - key: CTU_BEHAVIOR_MODE
        value: auto
      - key: REQUEST_TIMEOUT_SECS
        value: "60"
      - key: HEADLESS
        value: "1"
      - key: CTU_SELF_HOSTED
        value: "0"

      # ✅ chromium safe flags & budgets (these were previously outside envVars)
      - key: CTU_PW_ARGS
        value: "--no-sandbox,--disable-dev-shm-usage,--disable-gpu,--disable-setuid-sandbox,--single-process,--disable-features=IsolateOrigins,site-per-process,--disable-blink-features=AutomationControlled"
      - key: CTU_BEHAVIOR_BUDGET
        value: "8.0"
      - key: CTU_REQUEST_BUDGET
        value: "22.0"
      - key: CTU_CONNECT_TIMEOUT
        value: "3.0"
      - key: CTU_READ_TIMEOUT
        value: "5.0"

      # keep these managed in the dashboard (don’t commit secrets)
      - key: GOOGLE_API_KEY
        sync: false
      - key: VIRUSTOTAL_API_KEY
        sync: false

      # if you’re using feedback in app.py, include or mark as dashboard-managed
      - key: CTU_FEEDBACK
        value: "1"
      - key: CTU_FEEDBACK_SALT
        sync: false
