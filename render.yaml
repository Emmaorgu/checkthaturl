services:
  - type: web
    name: checkthaturl-clean
    env: python
    plan: free
    region: oregon
    buildCommand: pip install --no-cache-dir -r requirements.txt
    startCommand: gunicorn app.app:app -w 2 -k gthread --threads 4 --timeout 180 --bind 0.0.0.0:$PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: CTU_SELF_HOSTED
        value: "0"
      - key: CTU_BEHAVIOR_MODE
        value: "auto"
      - key: CTU_FETCH_LEGAL
        value: "1"
      - key: CTU_TRUSTED_PSP
        value: "paypal.com,stripe.com,paystack.com,flutterwave.com,interswitchgroup.com,monnify.com,accounts.google.com,google.com,live.com,microsoftonline.com,apple.com,amazon.com"
      - key: CTU_TRUSTED_DOMAINS
        value: ""
      - key: CTU_CONNECT_TIMEOUT
        value: "2.0"
      - key: CTU_READ_TIMEOUT
        value: "3.0"
      - key: CTU_REQUEST_BUDGET
        value: "18.0"
      - key: CTU_BEHAVIOR_BUDGET
        value: "6.0"
      - key: CTU_FEEDBACK
        value: "1"
      - key: CTU_FEEDBACK_SALT
        sync: false
