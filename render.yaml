services:
  - type: web
    name: checkthaturl
    env: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    autoDeploy: true

    # You can keep this even with Dockerfile HEALTHCHECK
    healthCheckPath: /health

    envVars:
      # --- your existing flags preserved ---
      - key: CTU_SELF_HOSTED
        value: "0"
      - key: CTU_BEHAVIOR
        value: "1"
      - key: CTU_PLAYWRIGHT
        value: "0"
      - key: CTU_PLAYWRIGHT_HEADLESS
        value: "1"
      - key: CTU_VISUAL
        value: "0"
      - key: CTU_FEEDBACK
        value: "1"
      - key: CTU_FEEDBACK_SALT
        sync: false

      # --- new flags used by the hardened backend you deployed ---
      # First deploy: set to "off" if you want zero risk, then switch to "auto".
      - key: CTU_BEHAVIOR_MODE
        value: "auto"
      - key: CTU_BEHAVIOR_TIMEOUT_SEC
        value: "8"
      - key: CTU_SOFT_WHITELIST_SELF
        value: "1"

      # Render injects PORT; Dockerfile uses it in CMD
      - key: PORT
        value: "10000"

    disks:
      - name: ctu-data
        mountPath: /opt/render/project/src/data
        sizeGB: 1
