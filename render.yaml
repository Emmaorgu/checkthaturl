services:
  - type: web
    name: checkthaturl
    env: docker
    plan: starter
    autoDeploy: true
    healthCheckPath: /healthz
    envVars:
      - key: TZ
        value: Africa/Lagos
      - key: SCAN_MODE
        value: playwright
      - key: CTU_BEHAVIOR_MODE
        value: auto
      - key: REQUEST_TIMEOUT_SECS
        value: "60"
      - key: HEADLESS
        value: "1"
      - key: CTU_SELF_HOSTED
        value: "0"

      # 🔒 set these in the Render dashboard (don’t commit secrets)
      - key: GOOGLE_API_KEY
        sync: false
      - key: VIRUSTOTAL_API_KEY
        sync: false
